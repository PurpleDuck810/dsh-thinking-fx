<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-thinking-fx preview</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="chatview.css">
<link rel="stylesheet" href="../lib/thinking-fx.css">
<style>
  html, body { margin: 0; background: #0d0f16; }
  body {
    padding: 20px 24px;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    color: #e8ecf5;
    --dsw-alias-label-deep-diving: #6f96ff;
    --dsw-alias-label-deep-diving-shimmer: #c3d6ff;
    --dsh-content-font-size: 14px;
    --dsh-content-font-delta: 0px;
  }
  #row { display: inline-flex; }
  /* 与 ui-chat/accessibility.module.css 同义：预览页没加载那个模块，手动补一条 */
  .glcmna_visuallyHidden { clip: rect(0 0 0 0); white-space: nowrap; width: 1px; height: 1px; position: absolute; overflow: hidden; }
</style>
</head>
<body>
  <!-- 与 RunningStatus / RunningWhaleTail 的实际 DOM 同构 -->
  <div id="row">
    <div class="xz4KEq_running" data-chat-running>
      <span class="glcmna_visuallyHidden" role="status" aria-live="polite" aria-atomic="true">深度求索中</span>
      <span class="xz4KEq_runningDivider" aria-hidden="true"></span>
      <span class="xz4KEq_runningContent">
        <span class="xz4KEq_runningIcon" aria-hidden="true">
          <span class="xz4KEq_runningWhaleAnimated"></span>
          <svg class="xz4KEq_runningWhaleStill" width="100%" height="100%" viewBox="0 0 16 16" fill="none">
            <path d="M8.844 13.742C8.967 12.328 8.45 10.4 8.45 9.65C8.45 8.94 8.88 8.43 9.6 8.43C11.285 8.43 12.106 8.281 12.685 8.104C13.71 7.791 14.585 6.768 15.055 5.945C15.137 5.803 14.99 5.641 14.829 5.671C13.829 5.86 12.828 5.376 11.827 4.978C10.659 4.514 9.491 4.707 8.935 4.876C8.805 4.915 8.658 4.819 8.636 4.686C8.468 3.643 7.405 2.615 5.498 2.238C4.54 2.048 3.748 1.574 3.347 1.202C3.252 1.113 3.088 1.125 3.03 1.242C2.628 2.059 2.168 3.82 5.248 6.115C5.82 6.494 6.31 6.785 6.574 7.637C6.72 8.104 6.157 9.168 6.061 9.368C5.157 11.27 5.089 12.19 4.926 13.742" stroke="currentColor" stroke-width="1"/>
          </svg>
        </span>
        <span class="_root_1rdzk_1 xz4KEq_runningText" data-shimmer>
          <span class="_content_1rdzk_11">
            <span class="_text_1rdzk_17" data-shimmer-text="深度求索中，用时 4分45秒 ···"></span>
          </span>
          <span class="_decoration_1rdzk_25" aria-hidden="true">
            <span class="_sweep_1rdzk_34">
              <span class="_content_1rdzk_11 _highlight_1rdzk_54">
                <span class="_text_1rdzk_17" data-shimmer-text="深度求索中，用时 4分45秒 ···"></span>
              </span>
            </span>
          </span>
        </span>
      </span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search)
    const fx = params.get('fx') || 'none'
    if (fx !== 'none') {
      document.documentElement.dataset.thinkingFx = fx
      document.documentElement.dataset.thinkingFxText = params.get('text') || 'keep'
    }
    const size = params.get('size')
    if (size) document.documentElement.style.setProperty('--tfx-size', `${size}px`)
    const scale = params.get('scale')
    if (scale) document.documentElement.style.setProperty('--tfx-text-scale', scale)

    // glyph 预设用第一张动画当 mask（插件构建时会把五张都内联成 data URI）
    const frame = params.get('frame') || '0'
    document.documentElement.style.setProperty('--tfx-glyph', `url("/assets/glyph-${frame}.webp")`)
    document.documentElement.style.setProperty('--tfx-glyph-still', `url("/assets/still-${frame}.png")`)
  </script>
</body>
</html>
